name: review

# ATLAS independent reviewer (story 3.2). A second claude-code-action run, distinct from the build agent,
# reviews every PR from an `atlas/{run_id}/{mission_id}` branch of this repository and sets the commit
# status `atlas-review`, required by the `protect-main` ruleset next to `ci`:
#   approve          -> review posted, atlas-review = success, auto-merge (squash) enabled by the GitHub App,
#                       unless the PR touches a CODEOWNERS path (then Ronan is asked to review, no auto-merge);
#   request changes  -> review posted with comments, atlas-review = failure, auto-merge disabled;
#   reviewer failure -> atlas-review = error (re-run the workflow).
# Any other same-repo PR (human branch) gets atlas-review = success immediately: the agent review only
# gates Factory PRs. Fork PRs get no status from this workflow.
#
# Story 6.2: the reviewer judges on evidence. Job `verify` runs the PR head's gates (lint, typecheck, unit
# tests, architecture rules, build, Playwright e2e) and uploads the `atlas-proof` bundle: per-gate results,
# the Vitest and Playwright JSON reports and the e2e screenshots. Job `review` validates it, computes the
# acceptance coverage (each criterion of the PR body's mini-spec proved by a passing test named AC<n>) and
# hands it to the reviewer under `.atlas-proof/`. An approval without full proof becomes a change request.
#
# Trust boundaries (pull_request_target runs with this repository's secrets):
# - Job `verify` is the only one that runs PR code: no secret, no environment, a read-only job token, a
#   checkout of the PR head without credentials, egress limited to an allowlist (harden-runner, no
#   Anthropic host), sudo and Docker removed before any PR script runs.
# - In `review`, the workflow, the prompt and CLAUDE.md come from the base branch (main). The PR head is
#   checked out into `.atlas-pr/` as data only, without credentials, stripped of instruction files and
#   symlinks. No step of `review` runs PR code: the evidence arrives as data (JSON and PNG files only,
#   size-capped, symbolic links refused) and is summarised with jq.
# - The reviewer only has read tools; the verdict comes back as structured output and is posted by this
#   workflow with the GitHub App token, minted after the agent has finished.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

# A new push supersedes the review of the previous head.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pass-through:
    name: atlas-review (not an ATLAS branch)
    # Same-repo PRs only: a fork PR gets no atlas-review status from this workflow (a maintainer merges it).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'atlas/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Set atlas-review to success
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected head SHA"
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success -f context=atlas-review \
            -f description="Not an ATLAS branch: no agent review required" > /dev/null

  verify:
    name: verify
    # Same ATLAS PRs as `review`. Runs the PR head's code: no secret, no environment, read-only token.
    if: >-
      startsWith(github.event.pull_request.head.ref, 'atlas/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      COREPACK_VERSION: 0.36.0
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # First step: every later process (installs, gates, the server Playwright starts) can only reach these
      # hosts (the build agent's allowlist without the Anthropic hosts); loopback stays open.
      - name: Restrict network egress (harden-runner)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            storage.googleapis.com:443
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            cdn.playwright.dev:443
            playwright.download.prss.microsoft.com:443
            archive.ubuntu.com:80
            azure.archive.ubuntu.com:80
            security.ubuntu.com:80
            packages.microsoft.com:443
            esm.ubuntu.com:443

      - name: Checkout the PR head (no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: |
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          pnpm --version

      # No lifecycle script and no pnpmfile yet: no PR-controlled code runs while sudo is still available.
      - name: Install dependencies (scripts off)
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Drop root and containers before the PR code runs
        run: |
          set -euo pipefail
          # From here on every process runs PR code: no sudo, no Docker, so nothing can lift the egress block.
          sudo systemctl stop docker.socket docker.service containerd.service > /dev/null 2>&1 || true
          sudo rm -f /var/run/docker.sock /run/containerd/containerd.sock
          sudo sh -c "sed -i -E '/^[[:space:]]*(runner|%sudo|%admin)[[:space:]]/d' /etc/sudoers && find /etc/sudoers.d -type f -delete"
          if sudo -n true > /dev/null 2>&1; then
            echo "::error::sudo is still available to the runner user"
            exit 1
          fi
          echo "sudo and Docker are off for the rest of the job."

      # Every gate runs, even after a failure, so the bundle tells the reviewer everything that is wrong.
      - name: Run the gates and collect the evidence
        id: gates
        timeout-minutes: 30
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/atlas-proof"
          log="$RUNNER_TEMP/atlas-verify.log"
          results="$RUNNER_TEMP/atlas-gates.ndjson"
          rm -rf "$out" "$results" test-results playwright-report
          mkdir -p "$out/shots"
          failed=0
          for gate in install lint typecheck test arch build test:e2e; do
            case "$gate" in
              install) cmd=(pnpm install --frozen-lockfile --offline) ;;
              test) cmd=(pnpm test --reporter=default --reporter=json "--outputFile.json=$out/vitest.json") ;;
              *) cmd=(pnpm "$gate") ;;
            esac
            echo "::group::pnpm $gate"
            if "${cmd[@]}" > "$log" 2>&1; then status=passed; else status=failed; failed=1; fi
            cat "$log"
            echo "::endgroup::"
            output=""
            if [ "$status" = "failed" ]; then
              echo "::error::gate pnpm $gate failed"
              output="$(sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$log" | tail -c 20000)"
            fi
            jq -cn --arg name "$gate" --arg status "$status" --arg output "$output" \
              '{name: $name, status: $status, output: (if $output == "" then null else $output end)}' >> "$results"
          done
          jq -s --arg head_sha "$HEAD_SHA" '{head_sha: $head_sha, gates: .}' "$results" > "$out/gates.json"
          if [ -f test-results/e2e.json ] && [ ! -L test-results/e2e.json ]; then cp test-results/e2e.json "$out/e2e.json"; fi
          shots=0
          if [ -d test-results/playwright/shots ]; then
            while IFS= read -r -d '' shot; do
              name="$(basename "$shot")"
              [[ "$name" =~ ^[A-Za-z0-9._-]+\.png$ ]] || continue
              [ "$shots" -lt 30 ] || break
              cp "$shot" "$out/shots/$name"
              shots=$((shots + 1))
            done < <(find test-results/playwright/shots -maxdepth 1 -type f -name '*.png' -print0 | sort -z)
          fi
          echo "Evidence: $(jq -c '[.gates[] | "\(.name)=\(.status)"]' "$out/gates.json"), $shots screenshot(s)"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Upload the evidence bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-proof
          path: ${{ runner.temp }}/atlas-proof/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail when a gate failed
        if: steps.gates.outputs.failed != '0'
        run: |
          echo "::error::at least one gate failed on the PR head (see the evidence bundle)"
          exit 1

  review:
    name: review
    needs: verify
    # Runs when verify failed too (the evidence says why), but not for a superseded, cancelled run.
    if: >-
      !cancelled() &&
      startsWith(github.event.pull_request.head.ref, 'atlas/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: atlas-agents
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Validate the PR and set atlas-review to pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::unexpected pull request payload"
            exit 1
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if ! [[ "$HEAD_REF" =~ ^atlas/run_[0-9A-HJKMNP-TV-Z]{26}/msn_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state=failure -f context=atlas-review -f target_url="$run_url" \
              -f description="Malformed ATLAS branch name (expected atlas/{run_id}/{mission_id})" > /dev/null
            echo "::error::malformed ATLAS branch name"
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context=atlas-review -f target_url="$run_url" \
            -f description="ATLAS reviewer running" > /dev/null

      # Only to learn the App's bot login for `allowed_bots`: metadata read, no write access.
      - name: Identify the GitHub App (read-only token)
        id: identity
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ATLAS_APP_ID }}
          private-key: ${{ secrets.ATLAS_APP_PRIVATE_KEY }}
          repositories: wedding-pilot
          permission-metadata: read

      # pull_request_target checks out the base branch by default: instructions come from main.
      - name: Checkout the base branch (instructions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the PR head as data (never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .atlas-pr
          fetch-depth: 0
          persist-credentials: false

      # Same run: no token needed. Data only, never executed; validated in the next steps.
      - name: Get the verification evidence (data only)
        id: evidence_download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atlas-proof
          path: ${{ runner.temp }}/atlas-proof-raw

      - name: Prepare the review inputs
        id: prep
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Only the scratch dir is git-excluded: .atlas-pr/ must stay visible to the reviewer's Glob/Grep.
          echo ".atlas-review/" >> .git/info/exclude
          mkdir -p .atlas-review
          pr_git() { git -C .atlas-pr -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          pr_git diff --no-ext-diff --no-textconv --no-renames "$BASE_SHA...$HEAD_SHA" > .atlas-review/pr.diff
          pr_git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" | tr '\0' '\n' > .atlas-review/changed-files.txt
          printf '%s\n' "$PR_BODY" > .atlas-review/pr-body.md
          jq -n --arg number "$PR_NUMBER" --arg title "$PR_TITLE" --arg branch "$HEAD_REF" \
            --arg base_sha "$BASE_SHA" --arg head_sha "$HEAD_SHA" \
            '{number: ($number | tonumber), title: $title, branch: $branch, base: "main", base_sha: $base_sha, head_sha: $head_sha}' \
            > .atlas-review/pr.json

          # The reviewer must never read instructions from the PR branch: drop them (their changes stay
          # visible in pr.diff), and drop symlinks that could point outside the checkout.
          find .atlas-pr -path .atlas-pr/.git -prune -o \
            \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name .claude -o -name .mcp.json -o -name .claude.json \) \
            -print0 | xargs -0 -r rm -rf
          find .atlas-pr -path .atlas-pr/.git -prune -o -type l -print0 | xargs -0 -r rm -f

          # Paths owned in CODEOWNERS (read from the base branch) need Ronan's review: no auto-merge.
          mapfile -t owned < <(grep -Ev '^[[:space:]]*(#|$)' .github/CODEOWNERS | awk '{print $1}')
          : > .atlas-review/sensitive-files.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            for pattern in "${owned[@]}"; do
              p="${pattern#/}"
              if [[ "$p" == */ ]]; then
                [[ "$file" == "$p"* ]] && { echo "$file" >> .atlas-review/sensitive-files.txt; break; }
              elif [[ "$file" == "$p" || "$file" == "$p/"* ]]; then
                echo "$file" >> .atlas-review/sensitive-files.txt
                break
              fi
            done
          done < .atlas-review/changed-files.txt
          if [ -s .atlas-review/sensitive-files.txt ]; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
            echo "PR touches CODEOWNERS paths:"
            cat .atlas-review/sensitive-files.txt
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

          delimiter="ATLAS_PROMPT_$(openssl rand -hex 16)"
          { echo "prompt<<$delimiter"; cat .github/atlas/review-prompt.md; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      - name: Validate the evidence and summarise it for the reviewer
        id: evidence
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          DOWNLOAD_OUTCOME: ${{ steps.evidence_download.outcome }}
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/atlas-proof-raw"
          dest=.atlas-proof
          rm -rf "$dest"
          mkdir -p "$dest/shots"
          problems="$RUNNER_TEMP/atlas-proof-problems.txt"
          : > "$problems"
          max_json=$((5 * 1024 * 1024))
          max_png=$((5 * 1024 * 1024))
          max_total=$((60 * 1024 * 1024))
          max_shots=30
          total=0
          shots=0
          if [ "$DOWNLOAD_OUTCOME" != "success" ] || [ ! -d "$raw" ]; then
            echo "verify uploaded no evidence bundle" >> "$problems"
          elif [ -n "$(find "$raw" \( -type l -o \( ! -type f ! -type d \) \) -print -quit)" ]; then
            echo "the evidence bundle contains symbolic links or special files: refused as a whole" >> "$problems"
          else
            # Only the expected names are kept: JSON reports and PNG screenshots, each size-capped.
            while IFS= read -r -d '' file; do
              rel="${file#"$raw"/}"
              size="$(stat -c %s "$file")"
              case "$rel" in
                gates.json | vitest.json | e2e.json)
                  if [ "$size" -gt "$max_json" ]; then
                    echo "$rel is larger than 5 MB: dropped" >> "$problems"
                  elif ! jq -e 'type == "object"' "$file" > /dev/null 2>&1; then
                    echo "$rel is not a JSON object: dropped" >> "$problems"
                  else
                    cp "$file" "$dest/$rel"
                    total=$((total + size))
                  fi
                  ;;
                shots/*)
                  name="${rel#shots/}"
                  magic="$(head -c 8 "$file" | od -An -tx1 | tr -d ' \n')"
                  if ! [[ "$name" =~ ^[A-Za-z0-9._-]+\.png$ ]]; then
                    echo "screenshot with an unexpected name dropped" >> "$problems"
                  elif [ "$magic" != "89504e470d0a1a0a" ]; then
                    echo "shots/$name is not a PNG: dropped" >> "$problems"
                  elif [ "$size" -gt "$max_png" ] || [ "$shots" -ge "$max_shots" ] || [ $((total + size)) -gt "$max_total" ]; then
                    echo "shots/$name is over the size or count cap: dropped" >> "$problems"
                  else
                    cp "$file" "$dest/shots/$name"
                    total=$((total + size))
                    shots=$((shots + 1))
                  fi
                  ;;
                *) echo "unexpected file dropped from the bundle" >> "$problems" ;;
              esac
            done < <(find "$raw" -type f -print0 | sort -z)
          fi

          # Acceptance criteria: the numbered list under `## Acceptance criteria` of the PR body's `## Mini-spec`
          # section (written by build.yml; the last `## Mini-spec` heading wins), numbered AC1, AC2...
          awk '
            { sub(/\r$/, "") }
            /^## Mini-spec[[:space:]]*$/ { m = 1; a = 0; n = 0; next }
            m && /^## Acceptance criteria/ { a = 1; next }
            m && a && (/^## / || /^---[[:space:]]*$/) { a = 0 }
            m && a && /^[0-9]+\. / { sub(/^[0-9]+\. /, ""); c[++n] = $0 }
            END { for (i = 1; i <= n; i++) print c[i] }
          ' .atlas-review/pr-body.md | jq -R . | jq -s . > "$RUNNER_TEMP/atlas-criteria.json"
          for report in gates vitest e2e; do
            if [ -f "$dest/$report.json" ]; then cp "$dest/$report.json" "$RUNNER_TEMP/atlas-$report.json"; else echo null > "$RUNNER_TEMP/atlas-$report.json"; fi
          done
          find "$dest/shots" -type f -name '*.png' | sort | jq -R . | jq -s . > "$RUNNER_TEMP/atlas-shots.json"
          jq -R . < "$problems" | jq -s . > "$RUNNER_TEMP/atlas-problems.json"

          jq -n --arg head_sha "$HEAD_SHA" --arg verify "$VERIFY_RESULT" \
            --slurpfile criteria "$RUNNER_TEMP/atlas-criteria.json" --slurpfile gates "$RUNNER_TEMP/atlas-gates.json" \
            --slurpfile unit "$RUNNER_TEMP/atlas-vitest.json" --slurpfile e2e "$RUNNER_TEMP/atlas-e2e.json" \
            --slurpfile shots "$RUNNER_TEMP/atlas-shots.json" --slurpfile problems "$RUNNER_TEMP/atlas-problems.json" \
            -f .github/atlas/proof-summary.jq > "$dest/summary.json"
          jq -r '"Evidence: proved=\(.proved); " + ((.reasons | join("; ")) | if . == "" then "nothing missing" else . end)' "$dest/summary.json"

      - name: Install bubblewrap and socat (Claude Code sandbox dependencies)
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap socat

      - name: Run the reviewer (Claude Code, subscription, read-only)
        id: agent
        continue-on-error: true
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: ${{ steps.identity.outputs.app-slug }}[bot]
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","summary","comments"],"properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"summary":{"type":"string"},"comments":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["path","body"],"properties":{"path":{"type":"string"},"line":{"type":"integer","minimum":1},"body":{"type":"string"}}}}}}'

      # Write access exists only from here on, after the reviewer has finished.
      - name: Mint the GitHub App token (review and merge)
        id: app-token
        if: steps.agent.outcome == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ATLAS_APP_ID }}
          private-key: ${{ secrets.ATLAS_APP_PRIVATE_KEY }}
          repositories: wedding-pilot
          permission-contents: write
          permission-pull-requests: write

      - name: Post the verdict, set atlas-review, enable auto-merge
        if: always() && steps.prep.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STATUS_TOKEN: ${{ github.token }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          REVIEW_JSON: ${{ steps.agent.outputs.structured_output }}
          SENSITIVE: ${{ steps.prep.outputs.sensitive }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          set_status() {
            GH_TOKEN="$STATUS_TOKEN" gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$1" -f context=atlas-review -f target_url="$run_url" -f description="$2" > /dev/null
          }

          verdict=""
          if [ "$AGENT_OUTCOME" = "success" ] && [ -n "$GH_TOKEN" ]; then
            verdict="$(jq -r '.verdict // empty' <<< "$REVIEW_JSON" 2> /dev/null || true)"
          fi
          if [ "$verdict" != "approve" ] && [ "$verdict" != "request_changes" ]; then
            set_status error "The ATLAS reviewer did not complete: re-run the review workflow"
            echo "::error::no valid verdict from the reviewer (agent outcome: $AGENT_OUTCOME)"
            exit 1
          fi

          # Story 6.2: the evidence decides in code too. An approval without full proof becomes a change request.
          proof=.atlas-proof/summary.json
          if ! jq -e 'type == "object" and (.reasons | type) == "array"' "$proof" > /dev/null 2>&1; then
            jq -n '{proved: false, reasons: ["no evidence summary"]}' > "$RUNNER_TEMP/atlas-no-proof.json"
            proof="$RUNNER_TEMP/atlas-no-proof.json"
          fi
          if [ "$verdict" = "approve" ] && ! jq -e '.proved == true' "$proof" > /dev/null; then
            REVIEW_JSON="$(jq -c --slurpfile p "$proof" '.verdict = "request_changes"
              | .summary += "\n\n**Not approved by the workflow:** the delivery is not proved (" + ($p[0].reasons | join("; ")) + ")."' <<< "$REVIEW_JSON")"
            verdict=request_changes
            echo "::warning::the reviewer approved without full proof: changed to request_changes"
          fi
          evidence_line="$(jq -r '
            def n($x): if $x == null then "?" else ($x | tostring) end;
            "**Evidence** (verify job on this head): unit tests \(n(.unit.passed)) passed / \(n(.unit.failed)) failed, "
            + "e2e \(n(.e2e.passed)) passed / \(n(.e2e.failed)) failed, "
            + "acceptance criteria \(n(.acceptance.covered))/\(n(.acceptance.criteria)) covered, "
            + "\((.screenshots // []) | length) screenshot(s)."
            + (if (.reasons | length) > 0 then " Missing: " + (.reasons | join("; ")) + "." else "" end)' "$proof")"

          # Review body: verdict, summary, then the comments (inline ones are also attached to their line).
          render_body() { # $1 = all | not-inline
            jq -r --arg mode "$1" --arg run_url "$run_url" --arg evidence "$evidence_line" '
              "**ATLAS review: " + (if .verdict == "approve" then "approve" else "changes requested" end)
              + "** ([review run](" + $run_url + "))\n\n" + .summary + "\n\n" + $evidence
              + ( [ .comments[] | select($mode == "all" or (.line == null)) ]
                  | if length == 0 then ""
                    else "\n\n### Comments\n\n" + (map("- `" + .path + (if .line then ":" + (.line | tostring) else "" end) + "`: " + .body) | join("\n"))
                    end )' <<< "$REVIEW_JSON"
          }
          post_review() { # $1 = event, $2 = body mode, $3 = with inline comments (true|false)
            jq -n --arg event "$1" --arg body "$(render_body "$2")" --arg commit "$HEAD_SHA" \
              --argjson inline "$3" --argjson review "$REVIEW_JSON" \
              '{event: $event, body: $body, commit_id: $commit}
               + (if $inline then {comments: [ $review.comments[] | select(.line != null)
                    | {path, line, side: "RIGHT", body} ]} else {} end)' > "$RUNNER_TEMP/atlas-review.json"
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --input "$RUNNER_TEMP/atlas-review.json" > /dev/null
          }
          if [ "$verdict" = "approve" ]; then event=APPROVE; else event=REQUEST_CHANGES; fi
          # GitHub refuses inline comments outside the diff, and an approval or a change request from the
          # PR author (the App opened the PR): fall back to a plain review, then to a comment review.
          if post_review "$event" not-inline true || post_review "$event" all false; then
            echo "Posted a $event review"
          elif post_review COMMENT all false; then
            echo "::notice::GitHub refused a $event review from the App (PR author); posted the verdict as a comment review"
          else
            echo "::warning::could not post the review; the atlas-review status still carries the verdict"
          fi

          if [ "$verdict" = "request_changes" ]; then
            set_status failure "ATLAS reviewer requested changes"
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto > /dev/null 2>&1 || true
            exit 0
          fi

          set_status success "ATLAS reviewer approved"
          if [ "$SENSITIVE" = "true" ]; then
            {
              echo "The ATLAS reviewer approved this PR, but it touches paths that need @RonanTardif's review (CODEOWNERS), so it is **not** merged automatically:"
              echo
              # shellcheck disable=SC2016 # literal backticks (Markdown code spans)
              sed 's/^/- `/; s/$/`/' .atlas-review/sensitive-files.txt
            } > "$RUNNER_TEMP/atlas-sensitive.md"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/atlas-sensitive.md"
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto > /dev/null 2>&1 || true
          else
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA"
            echo "Auto-merge (squash) enabled: merges once ci and atlas-review pass"
          fi
