name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  COREPACK_VERSION: 0.36.0
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard - no Anthropic API key under .github
        run: bash scripts/guard-forbidden-key.sh .github

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          ./gitleaks git --redact --verbose --exit-code 1 .

      - name: Secret scan self-test (gitleaks must detect a planted fake secret)
        # The fake token is generated at runtime in a temp dir outside the checkout; nothing is committed.
        run: |
          canary_dir="$(mktemp -d)"
          printf 'const token = "ghp_%s";\n' "$(openssl rand -hex 18)" > "$canary_dir/config.ts"
          # A distinct exit code separates "leak found" (42) from a clean scan (0) or a gitleaks error.
          rc=0
          ./gitleaks dir --redact --no-banner --exit-code 42 "$canary_dir" || rc=$?
          if [ "$rc" -ne 42 ]; then
            echo "::error::gitleaks did not detect the planted fake secret (exit code $rc)"
            exit 1
          fi
          echo "gitleaks detected the planted fake secret as expected"
          rm -rf "$canary_dir" gitleaks

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        # Node >= 25 no longer bundles corepack; install a pinned version first.
        run: |
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Architecture rules
        run: pnpm arch

      - name: Build
        run: pnpm build
