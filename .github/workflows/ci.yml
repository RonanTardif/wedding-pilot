name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  COREPACK_VERSION: 0.36.0
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard - no Anthropic API key name anywhere in the repo
        run: bash scripts/guard-forbidden-key.sh .

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          ./gitleaks git --redact --verbose --exit-code 1 .

      - name: Secret scan self-test (gitleaks must detect a planted fake secret)
        # The fake token is generated at runtime in a temp dir outside the checkout; nothing is committed.
        run: |
          canary_dir="$(mktemp -d)"
          printf 'const token = "ghp_%s";\n' "$(openssl rand -hex 18)" > "$canary_dir/config.ts"
          # A distinct exit code separates "leak found" (42) from a clean scan (0) or a gitleaks error.
          rc=0
          ./gitleaks dir --redact --no-banner --exit-code 42 "$canary_dir" || rc=$?
          if [ "$rc" -ne 42 ]; then
            echo "::error::gitleaks did not detect the planted fake secret (exit code $rc)"
            exit 1
          fi
          echo "gitleaks detected the planted fake secret as expected"
          rm -rf "$canary_dir" gitleaks

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        # Node >= 25 no longer bundles corepack; install a pinned version first.
        run: |
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Architecture rules
        run: pnpm arch

      - name: Build
        # The home page highlights a step from the current time: `/` must stay dynamic (never prerendered).
        run: |
          set -o pipefail
          pnpm build | tee build.log
          if ! grep -Eq 'ƒ /([[:space:]]|$)' build.log; then
            echo "::error::next build does not list / as dynamic (ƒ /)"
            exit 1
          fi
          rm build.log

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform fmt and validate (no backend, no credentials)
        run: |
          terraform -chdir=infrastructure fmt -check -recursive
          terraform -chdir=infrastructure init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infrastructure validate

      - name: Docker image smoke test (/version and /)
        run: |
          # The page must render the bundled programme and venues, not a fallback message (HTML-escaped couple names).
          couple_html="$(jq -r '.coupleNames' src/event-programme/adapters/outbound/event.json | sed 's/&/\&amp;/g')"
          venue_html="$(jq -r '.venues[0].name' src/venues/adapters/outbound/venues.json | sed 's/&/\&amp;/g')"
          docker build -t wedding-page:ci .
          docker run -d -p 8080:8080 -e GIT_SHA="$GITHUB_SHA" wedding-page:ci
          for attempt in $(seq 1 30); do
            served="$(curl -fsS --max-time 5 localhost:8080/version | jq -r '.sha' || true)"
            if [ "$served" = "$GITHUB_SHA" ]; then
              echo "/version returns $served (attempt $attempt)"
              status="$(curl -sS --max-time 5 -o page.html -w '%{http_code}' localhost:8080/ || true)"
              if [ "$status" != "200" ]; then
                echo "::error::/ returned HTTP '$status', expected 200"
                exit 1
              fi
              if ! grep -qF "$couple_html" page.html || ! grep -qF "Programme du jour" page.html; then
                echo "::error::/ does not render the bundled programme (couple names or 'Programme du jour' missing)"
                exit 1
              fi
              if ! grep -qF "$venue_html" page.html || ! grep -qF "Itinéraire" page.html; then
                echo "::error::/ does not render the bundled venues (first venue name or 'Itinéraire' missing)"
                exit 1
              fi
              if grep -qF "momentanément indisponible" page.html; then
                echo "::error::/ renders the fallback error message"
                exit 1
              fi
              # Usage events: no GCP credentials here, so the BigQuery sink fails softly and the route still answers 202.
              event='{"event_type":"page_viewed","properties":{"path":"/"},"session_id":"ci-session-0001","anonymous_user_id":"ci-user-0001"}'
              status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'x-atlas-traffic: synthetic' -d "$event" localhost:8080/api/events || true)"
              if [ "$status" != "202" ]; then
                echo "::error::POST /api/events (valid event, sink down) returned HTTP '$status', expected 202"
                exit 1
              fi
              status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"event_type":"unknown"}' localhost:8080/api/events || true)"
              if [ "$status" != "400" ]; then
                echo "::error::POST /api/events (invalid event) returned HTTP '$status', expected 400"
                exit 1
              fi
              exit 0
            fi
            sleep 2
          done
          echo "::error::/version did not return $GITHUB_SHA"
          exit 1
