name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  COREPACK_VERSION: 0.36.0
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard - no Anthropic API key name anywhere in the repo
        run: bash scripts/guard-forbidden-key.sh .

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          ./gitleaks git --redact --verbose --exit-code 1 .

      - name: Secret scan self-test (gitleaks must detect a planted fake secret)
        # The fake token is generated at runtime in a temp dir outside the checkout; nothing is committed.
        run: |
          canary_dir="$(mktemp -d)"
          printf 'const token = "ghp_%s";\n' "$(openssl rand -hex 18)" > "$canary_dir/config.ts"
          # A distinct exit code separates "leak found" (42) from a clean scan (0) or a gitleaks error.
          rc=0
          ./gitleaks dir --redact --no-banner --exit-code 42 "$canary_dir" || rc=$?
          if [ "$rc" -ne 42 ]; then
            echo "::error::gitleaks did not detect the planted fake secret (exit code $rc)"
            exit 1
          fi
          echo "gitleaks detected the planted fake secret as expected"
          rm -rf "$canary_dir" gitleaks

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        # Node >= 25 no longer bundles corepack; install a pinned version first.
        run: |
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          pnpm --version

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Typecheck
        id: typecheck
        run: pnpm typecheck

      # The JSON report is part of the delivery evidence the ATLAS reviewer reads (story 6.2).
      - name: Unit tests
        id: unit
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-proof"
          pnpm test --reporter=default --reporter=json "--outputFile.json=$RUNNER_TEMP/atlas-proof/vitest.json"

      - name: Architecture rules
        id: arch
        run: pnpm arch

      - name: Build
        id: build
        # The home page highlights a step from the current time: `/` must stay dynamic (never prerendered).
        run: |
          set -o pipefail
          pnpm build | tee build.log
          if ! grep -Eq 'ƒ /([[:space:]]|$)' build.log; then
            echo "::error::next build does not list / as dynamic (ƒ /)"
            exit 1
          fi
          rm build.log

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests (Playwright e2e on the production build)
        id: e2e
        # playwright.config.ts starts `next start` on localhost:3100 against the build above, writes
        # test-results/e2e.json and, in CI, a viewport screenshot at the end of each browser test.
        run: pnpm test:e2e

      # Story 6.2: the evidence the ATLAS reviewer (review.yml) downloads for a PR: gate outcomes, the Vitest and
      # Playwright JSON reports and at most 12 viewport screenshots. Produced by the PR's own code, so the reviewer
      # treats it as self-reported data; this job holds no secret and computes no verdict.
      - name: Collect the delivery evidence
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          ARCH: ${{ steps.arch.outcome }}
          BUILD: ${{ steps.build.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/atlas-proof"
          mkdir -p "$out/shots"
          state() { case "$1" in success) echo passed ;; failure) echo failed ;; *) echo not_run ;; esac; }
          jq -n --arg head_sha "$HEAD_SHA" \
            --arg install "$(state "$INSTALL")" --arg lint "$(state "$LINT")" --arg typecheck "$(state "$TYPECHECK")" \
            --arg test "$(state "$UNIT")" --arg arch "$(state "$ARCH")" --arg build "$(state "$BUILD")" \
            --arg e2e "$(state "$E2E")" \
            '{head_sha: $head_sha, gates: [
               {name: "install", status: $install}, {name: "lint", status: $lint}, {name: "typecheck", status: $typecheck},
               {name: "test", status: $test}, {name: "arch", status: $arch}, {name: "build", status: $build},
               {name: "test:e2e", status: $e2e}]}' > "$out/gates.json"
          if [ -f test-results/e2e.json ] && [ ! -L test-results/e2e.json ]; then cp test-results/e2e.json "$out/e2e.json"; fi
          shots=0
          if [ -d test-results/playwright ]; then
            while IFS= read -r -d '' shot; do
              [ "$shots" -lt 12 ] || break
              # <test directory>.png: the directory names the test and its project.
              name="$(printf '%s' "$(basename "$(dirname "$shot")")" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-100).png"
              cp "$shot" "$out/shots/$name"
              shots=$((shots + 1))
            done < <(find test-results/playwright -mindepth 2 -maxdepth 2 -type f -name 'test-*.png' -print0 | sort -z)
          fi
          echo "Evidence: $(jq -c '[.gates[] | "\(.name)=\(.status)"]' "$out/gates.json"), $shots screenshot(s)"

      - name: Upload the delivery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-proof
          path: ${{ runner.temp }}/atlas-proof/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform fmt and validate (no backend, no credentials)
        run: |
          terraform -chdir=infrastructure fmt -check -recursive
          terraform -chdir=infrastructure init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infrastructure validate

      - name: Docker image smoke test (/version and /)
        run: |
          # The page must render the bundled programme and venues, not a fallback message (HTML-escaped couple names).
          couple_html="$(jq -r '.coupleNames' src/event-programme/adapters/outbound/event.json | sed 's/&/\&amp;/g')"
          venue_html="$(jq -r '.venues[0].name' src/venues/adapters/outbound/venues.json | sed 's/&/\&amp;/g')"
          docker build -t wedding-page:ci .
          docker run -d -p 8080:8080 -e GIT_SHA="$GITHUB_SHA" wedding-page:ci
          for attempt in $(seq 1 30); do
            served="$(curl -fsS --max-time 5 localhost:8080/version | jq -r '.sha' || true)"
            if [ "$served" = "$GITHUB_SHA" ]; then
              echo "/version returns $served (attempt $attempt)"
              status="$(curl -sS --max-time 5 -o page.html -w '%{http_code}' localhost:8080/ || true)"
              if [ "$status" != "200" ]; then
                echo "::error::/ returned HTTP '$status', expected 200"
                exit 1
              fi
              if ! grep -qF "$couple_html" page.html || ! grep -qF "Programme du jour" page.html; then
                echo "::error::/ does not render the bundled programme (couple names or 'Programme du jour' missing)"
                exit 1
              fi
              if ! grep -qF "$venue_html" page.html || ! grep -qF "Itinéraire" page.html; then
                echo "::error::/ does not render the bundled venues (first venue name or 'Itinéraire' missing)"
                exit 1
              fi
              if grep -qF "momentanément indisponible" page.html; then
                echo "::error::/ renders the fallback error message"
                exit 1
              fi
              # Usage events: no GCP credentials here, so the BigQuery sink fails softly and the route still answers 202.
              event='{"event_type":"page_viewed","properties":{"path":"/"},"session_id":"ci-session-0001","anonymous_user_id":"ci-user-0001"}'
              status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'x-atlas-traffic: synthetic' -d "$event" localhost:8080/api/events || true)"
              if [ "$status" != "202" ]; then
                echo "::error::POST /api/events (valid event, sink down) returned HTTP '$status', expected 202"
                exit 1
              fi
              status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"event_type":"unknown"}' localhost:8080/api/events || true)"
              if [ "$status" != "400" ]; then
                echo "::error::POST /api/events (invalid event) returned HTTP '$status', expected 400"
                exit 1
              fi
              exit 0
            fi
            sleep 2
          done
          echo "::error::/version did not return $GITHUB_SHA"
          exit 1
